<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专属贪吃蛇 · 我的头像版</title>
<style>
:root{color-scheme:dark;--bg:#0a0b18;--panel:#14172b;--purple:#a78bfa;--cyan:#67e8f9;--text:#f4f4ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#22204a 0%,#0a0b18 58%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.app{width:min(960px,100%);display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
main,.side{background:rgba(20,23,43,.92);border:1px solid #37345d;border-radius:22px;padding:18px;box-shadow:0 20px 60px #0005}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:clamp(21px,3vw,30px);margin:0;letter-spacing:.02em}
.sub{color:#b8b9d9;font-size:13px;margin-top:5px}
.pill{border:1px solid #514b86;color:#d8ccff;border-radius:99px;padding:7px 10px;font-size:12px;white-space:nowrap}
.board-wrap{position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#0b1020;border-radius:15px;border:1px solid #35345c;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080918b8;border-radius:15px;padding:20px;text-align:center}
.overlay.hidden{display:none}
.overlay-card{max-width:320px}
.overlay h2{margin:0 0 8px;font-size:27px}
.overlay p{color:#d1d2ee;line-height:1.6;font-size:14px}
button,select{font:inherit;border:1px solid #55518b;background:#242444;color:white;border-radius:12px;padding:10px 13px;cursor:pointer}
button.primary{background:linear-gradient(135deg,#8b5cf6,#6366f1);border:0;font-weight:700}
button:hover{filter:brightness(1.12)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:#0e1123;border:1px solid #2c2d50;border-radius:14px;padding:12px}
.stat span{display:block;color:#b7b8d7;font-size:12px}
.stat strong{display:block;font-size:25px;margin-top:4px}
.side h2{font-size:17px;margin:2px 0 12px}
.profile{display:flex;align-items:center;gap:12px;margin:14px 0}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--purple);box-shadow:0 0 18px #a78bfa55}
.profile p{margin:0;font-size:13px;line-height:1.5;color:#d7d8f1}
.side label{display:block;color:#bfc0e0;font-size:13px;margin:13px 0 6px}
select{width:100%}
.tip{font-size:12px;line-height:1.65;color:#b8bad9}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);justify-content:center;gap:5px;margin:15px auto 5px}
.dpad button{padding:0;font-size:20px;background:#252448}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
footer{font-size:11px;color:#8f91b7;text-align:center;margin-top:12px}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.side h2,.profile,.tip,.dpad{grid-column:1/-1}.stats{margin:8px 0}.app main,.side{padding:14px}}
</style>
</head>
<body>
<div class="app">
<main>
<header><div><h1>🐍 我的专属贪吃蛇</h1><div class="sub">电影感背景 · 头像蛇头 · 头像食物</div></div><div class="pill">NEON ARCADE</div></header>
<div class="board-wrap">
<canvas id="game" width="600" height="600" aria-label="贪吃蛇游戏区域"></canvas>
<div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">使用方向键或 WASD 控制蛇头。地图已缩小，蛇头和食物更醒目；吃到头像得分，别撞墙或自己！</p><button class="primary" id="startBtn">开始游戏</button></div></div>
</div>
<div class="controls">
<button class="primary" id="pauseBtn">暂停 / 继续</button><button id="restartBtn">重新开始</button>
</div>
<footer>键盘：方向键 / WASD · 空格暂停 · 手机可使用下方方向键</footer>
</main>
<aside class="side">
<h2>游戏状态</h2>
<div class="stats"><div class="stat"><span>本局分数</span><strong id="score">0</strong></div><div class="stat"><span>最高分</span><strong id="best">0</strong></div></div>
<div class="profile"><img class="avatar" id="foodPreview" alt="食物头像"><p><b>头像食物</b><br>吃到它 +10 分</p></div>
<label for="difficulty">游戏难度</label><select id="difficulty"><option value="170">悠闲（慢）</option><option value="125" selected>经典（中）</option><option value="85">挑战（快）</option></select>
<div class="dpad" aria-label="方向控制"><button class="up" data-dir="up" aria-label="上">↑</button><button class="left" data-dir="left" aria-label="左">←</button><button class="down" data-dir="down" aria-label="下">↓</button><button class="right" data-dir="right" aria-label="右">→</button></div>
<p class="tip">小提示：背景使用你刚上传的电影感照片；蛇头和食物使用之前上传的两张照片。所有图片都已内嵌，无需额外复制图片文件。</p>
</aside>
</div>

const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let snake,dir,nextDir,food,score,best=0,timer=null,running=false,paused=false,gameOver=false;
try{best=Number(localStorage.getItem('mySnakeBest')||0)}catch(e){}
bestEl.textContent=best;
function reset(){snake=[{x:5,y:7},{x:4,y:7},{x:3,y:7},{x:2,y:7}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;scoreEl.textContent=0;paused=false;gameOver=false;placeFood();draw()}
function placeFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawImageCircle(img,x,y,size, fallback){ctx.save();ctx.beginPath();ctx.arc(x+size/2,y+size/2,size/2-1,0,Math.PI*2);ctx.clip();if(img.complete&&img.naturalWidth){const scale=Math.max(size/img.naturalWidth,size/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;ctx.drawImage(img,x+(size-w)/2,y+(size-h)/2,w,h)}else{ctx.fillStyle=fallback;ctx.fillRect(x,y,size,size)}ctx.restore();ctx.strokeStyle='#c4b5fd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+size/2,y+size/2,size/2-1,0,Math.PI*2);ctx.stroke()}
function draw(){
 ctx.clearRect(0,0,600,600);
 // User-provided cinematic portrait background, darkened to keep gameplay pieces readable.
 if(bgImg.complete && bgImg.naturalWidth){
   const scale=Math.max(600/bgImg.naturalWidth,600/bgImg.naturalHeight),w=bgImg.naturalWidth*scale,h=bgImg.naturalHeight*scale;
   ctx.drawImage(bgImg,(600-w)/2,(600-h)/2,w,h);
   ctx.fillStyle='rgba(4,5,14,.64)';ctx.fillRect(0,0,600,600);
 } else {ctx.fillStyle='#0b1020';ctx.fillRect(0,0,600,600)}
 ctx.strokeStyle='rgba(180,170,255,.16)';ctx.lineWidth=1;
 for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(600,i*CELL);ctx.stroke()}
 // Food avatar
 // Larger, more noticeable food avatar with a bright halo.
 const fx=food.x*CELL-4,fy=food.y*CELL-4,fs=CELL+8;
 ctx.save();ctx.shadowColor='#fb7185';ctx.shadowBlur=30;ctx.fillStyle='#fb7185';
 ctx.beginPath();ctx.arc(fx+fs/2,fy+fs/2,fs/2+1,0,Math.PI*2);ctx.fill();ctx.restore();
 drawImageCircle(foodImg,fx,fy,fs,'#fb7185');
 // Body and head use the same uploaded portrait icon for a consistent custom snake.
 snake.slice(1).forEach((s,i)=>{
   const inset=2, bx=s.x*CELL+inset, by=s.y*CELL+inset, bs=CELL-inset*2;
   ctx.save();ctx.shadowColor='#a78bfa';ctx.shadowBlur=12;
   ctx.beginPath();ctx.arc(bx+bs/2,by+bs/2,bs/2,0,Math.PI*2);ctx.fillStyle='#a78bfa';ctx.fill();ctx.restore();
   drawImageCircle(headImg,bx,by,bs,'#a78bfa');
 });
 // The head uses the same photo, enlarged to stand out from the body.
 const h=snake[0],size=CELL+14,x=h.x*CELL-(size-CELL)/2,y=h.y*CELL-(size-CELL)/2;
 ctx.save();ctx.shadowColor='#c4b5fd';ctx.shadowBlur=38;ctx.beginPath();ctx.arc(x+size/2,y+size/2,size/2,0,Math.PI*2);ctx.fillStyle='#a78bfa';ctx.fill();ctx.restore();
 drawImageCircle(headImg,x,y,size,'#a78bfa');
 // Small white direction marker on the head
 const cx=x+size/2,cy=y+size/2;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx+dir.x*7,cy+dir.y*7,3,0,Math.PI*2);ctx.fill();
}
function showOverlay(title,msg,buttonText){overlayTitle.textContent=title;overlayText.textContent=msg;document.getElementById('startBtn').textContent=buttonText;overlay.classList.remove('hidden')}
function hideOverlay(){overlay.classList.add('hidden')}
function stop(){if(timer){clearInterval(timer);timer=null}}
function start(){if(gameOver)reset();running=true;paused=false;hideOverlay();stop();timer=setInterval(tick,Number(document.getElementById('difficulty').value));draw()}
function pause(){if(!running||gameOver)return;if(paused){paused=false;hideOverlay();stop();timer=setInterval(tick,Number(document.getElementById('difficulty').value))}else{paused=true;stop();showOverlay('暂停中','休息一下，准备好后继续游戏。','继续游戏')}}
function endGame(){running=false;gameOver=true;stop();showOverlay('游戏结束！','本局得分：'+score+' 分。再来一局，刷新你的最高分！','再玩一次')}
function tick(){
 dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((s,i)=>i<snake.length-1&&s.x===h.x&&s.y===h.y)){endGame();return}
 snake.unshift(h);
 if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('mySnakeBest',best)}catch(e){}}placeFood()}
 else snake.pop();
 draw()
}
function changeDir(name){const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const d=map[name];if(!d)return;if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;if(!running&&!gameOver)start()}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();const keys={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(keys[k]){e.preventDefault();changeDir(keys[k])}else if(k===' '){e.preventDefault();pause()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>changeDir(b.dataset.dir)));
document.getElementById('startBtn').addEventListener('click',()=>{if(paused&&running){pause()}else start()});
document.getElementById('pauseBtn').addEventListener('click',()=>{if(!running&&!gameOver)start();else pause()});
document.getElementById('restartBtn').addEventListener('click',()=>{stop();reset();start()});
document.getElementById('difficulty').addEventListener('change',()=>{if(running&&!paused){stop();timer=setInterval(tick,Number(document.getElementById('difficulty').value))}});
reset();
</script>
</body>
</html>
